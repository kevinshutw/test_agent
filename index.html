<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 2.0: Ice-breaking Successful!</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 20% 20%, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(248, 250, 252, 0.88) 100%);
      --card-border: rgba(226, 232, 240, 0.8);
      --card-shadow: 0 20px 45px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(255, 255, 255, 0.8) inset;
      --card-hover-shadow: 0 28px 50px rgba(0, 0, 0, 0.11), 0 1px 3px rgba(255, 255, 255, 0.9) inset;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --badge-bg: rgba(168, 85, 247, 0.12);
      --badge-text: #7c3aed;
      --theme-btn-bg: rgba(241, 245, 249, 0.8);
      --theme-btn-border: #cbd5e1;
      --theme-btn-text: #475569;
      --message-color: #8b5cf6;
    }

    body.dark {
      --bg-gradient: radial-gradient(circle at 20% 20%, #0f172a 0%, #020617 100%);
      --card-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.88) 0%, rgba(15, 23, 42, 0.92) 100%);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(255, 255, 255, 0.05) inset;
      --card-hover-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), 0 1px 2px rgba(255, 255, 255, 0.1) inset;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --badge-bg: rgba(217, 70, 239, 0.2);
      --badge-text: #f472b6;
      --theme-btn-bg: rgba(51, 65, 85, 0.8);
      --theme-btn-border: #475569;
      --theme-btn-text: #e2e8f0;
      --message-color: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 50px 36px 40px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-border);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.4s ease, border-color 0.4s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-hover-shadow);
    }

    /* Theme Toggle in top-right */
    .theme-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--theme-btn-bg);
      border: 1px solid var(--theme-btn-border);
      color: var(--theme-btn-text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      transition: all 0.25s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      border-color: #a855f7;
    }

    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 6px 14px;
      border-radius: 50px;
      background: var(--badge-bg);
      color: var(--badge-text);
      margin-bottom: 18px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 28px;
      transition: color 0.3s ease;
    }

    /* Eye-catching Purple-to-Pink Gradient Button */
    .glow-button {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 14px 34px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Hover: scale up and shadow-lg */
    .glow-button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px -3px rgba(168, 85, 247, 0.5), 0 4px 12px -2px rgba(236, 72, 153, 0.45);
    }

    .glow-button:active {
      transform: scale(0.98);
    }

    /* Iterative agent metadata caption */
    .agent-caption {
      font-size: 0.75rem;
      color: var(--text-subtle);
      margin-top: 14px;
      font-weight: 400;
      line-height: 1.4;
      transition: color 0.3s ease;
    }

    .stats {
      margin-top: 24px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .click-count {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .message {
      font-size: 1rem;
      color: var(--message-color);
      font-weight: 500;
      line-height: 1.4;
      animation: fadeIn 0.4s ease-out;
      transition: color 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
      <span id="themeIcon">🌙</span>
      <span id="themeText">Dark Mode</span>
    </button>

    <span class="badge">Antigravity 2.0</span>
    <h1>Antigravity: Ice-breaking Successful!</h1>
    
    <button id="actionBtn" class="glow-button">Spark Inspiration</button>
    <p class="agent-caption">⚡ Automatically generated via iterative updates by the Antigravity 2.0 Desktop Agent.</p>
    
    <div class="stats">
      <div id="clickCount" class="click-count"></div>
      <div id="messageText" class="message"></div>
    </div>
  </div>

  <script>
    // Theme toggle handling
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    const body = document.body;

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark');
      const isDark = body.classList.contains('dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      themeText.textContent = isDark ? 'Light (Off-White)' : 'Dark (Night Mode)';
    });

    // Button interactions
    const messages = [
      "Every great journey starts with a single step!",
      "Keep pushing boundaries, you are doing amazing!",
      "Creativity is intelligence having fun!",
      "You are capable of building incredible things!",
      "The sky is not the limit; it is just the beginning!",
      "Small consistent steps lead to massive achievements!",
      "Believe in your ideas and bring them to life!",
      "You've got this! Keep coding and innovating!"
    ];

    let count = 0;
    const button = document.getElementById('actionBtn');
    const countDisplay = document.getElementById('clickCount');
    const messageDisplay = document.getElementById('messageText');

    button.addEventListener('click', () => {
      count++;
      countDisplay.textContent = `Clicks: ${count}`;
      
      const randomIndex = Math.floor(Math.random() * messages.length);
      messageDisplay.style.animation = 'none';
      void messageDisplay.offsetWidth; // Trigger reflow to restart animation
      messageDisplay.style.animation = 'fadeIn 0.4s ease-out';
      messageDisplay.textContent = `"${messages[randomIndex]}"`;
    });
  </script>
</body>
</html>
