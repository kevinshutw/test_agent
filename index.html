<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity: Ice-breaking Successful!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #e0c3fc 0%, #8ec5fc 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 240, 245, 0.75) 50%, rgba(230, 240, 255, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 
                  0 1px 3px rgba(255, 255, 255, 0.6) inset;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 48px rgba(0, 0, 0, 0.12),
                  0 1px 3px rgba(255, 255, 255, 0.8) inset;
    }

    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(142, 197, 252, 0.25);
      color: #4a6fa5;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #2d3748;
      line-height: 1.3;
      margin-bottom: 28px;
    }

    .glow-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 0 20px rgba(118, 75, 162, 0.45);
      transition: all 0.3s ease;
    }

    .glow-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(102, 126, 234, 0.7),
                  0 0 10px rgba(118, 75, 162, 0.5);
    }

    .glow-button:active {
      transform: scale(0.98);
    }

    .stats {
      margin-top: 28px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .click-count {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
    }

    .message {
      font-size: 1rem;
      color: #5a67d8;
      font-weight: 500;
      line-height: 1.4;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Welcome</span>
    <h1>Antigravity: Ice-breaking Successful!</h1>
    <button id="actionBtn" class="glow-button">Spark Inspiration</button>
    
    <div class="stats">
      <div id="clickCount" class="click-count"></div>
      <div id="messageText" class="message"></div>
    </div>
  </div>

  <script>
    const messages = [
      "Every great journey starts with a single step!",
      "Keep pushing boundaries, you are doing amazing!",
      "Creativity is intelligence having fun!",
      "You are capable of building incredible things!",
      "The sky is not the limit; it is just the beginning!",
      "Small consistent steps lead to massive achievements!",
      "Believe in your ideas and bring them to life!",
      "You've got this! Keep coding and innovating!"
    ];

    let count = 0;
    const button = document.getElementById('actionBtn');
    const countDisplay = document.getElementById('clickCount');
    const messageDisplay = document.getElementById('messageText');

    button.addEventListener('click', () => {
      count++;
      countDisplay.textContent = `Clicks: ${count}`;
      
      const randomIndex = Math.floor(Math.random() * messages.length);
      messageDisplay.style.animation = 'none';
      void messageDisplay.offsetWidth; // Trigger reflow to restart animation
      messageDisplay.style.animation = 'fadeIn 0.4s ease-out';
      messageDisplay.textContent = `"${messages[randomIndex]}"`;
    });
  </script>
</body>
</html>
